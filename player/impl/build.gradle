plugins {
  id 'software.ralf.storymile.library.kmp'
}

storymile {
  enableMetro true
}

dependencies {
  androidMainImplementation libs.androidx.media3.exoplayer

  commonMainImplementation project(':user:public')

  desktopMainImplementation libs.jlayer
}

tasks.named('desktopTestProcessResources') {
  from(project.isolated.rootProject.projectDirectory.dir('podcast/impl-fake/src/commonMain/composeResources/files/test-episodes')) {
    into 'test-episodes'
  }
}
