name: 'Prepare Emulator'
description: 'Common emulator setup steps'

inputs:
  system-image:
    description: 'System image path under the Android SDK system-images directory'
    required: true

runs:
  using: "composite"
  steps:
    # This is needed for hardware acceleration, see https://github.blog/changelog/2023-02-23-hardware-accelerated-android-virtualization-on-actions-windows-and-linux-larger-hosted-runners/
    - name: Enable Hardware Acceleration
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # This is needed to accept the Android license, see https://issuetracker.google.com/issues/193118030
    - name: Accept Android SDK License
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

    # Bump v1 in these keys to refresh the cached SDK packages.
    - name: Cache Android emulator
      uses: actions/cache@v6
      with:
        path: ${{ env.ANDROID_HOME }}/emulator
        key: android-emulator-${{ runner.os }}-${{ runner.arch }}-v1

    - name: Install missing Android emulator
      shell: bash
      run: |
        if [[ ! -x "$ANDROID_HOME/emulator/emulator" || ! -f "$ANDROID_HOME/emulator/package.xml" ]]; then
          sdkmanager --install "emulator"
        fi

    - name: Cache Android system image
      uses: actions/cache@v6
      with:
        path: ${{ env.ANDROID_HOME }}/system-images/${{ inputs.system-image }}
        key: android-system-image-${{ runner.os }}-${{ runner.arch }}-${{ inputs.system-image }}-v1
