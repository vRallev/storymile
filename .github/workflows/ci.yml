name: CI

on:
  push:
    branches:
      - main
    tags-ignore:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  # Replace older PR runs; give every main push its own group so none are dropped.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GRADLE_ARGS: --stacktrace --continue --show-version

jobs:
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Report failures, but allow superseded PR runs to cancel this job too.
    if: ${{ !cancelled() }}
    # Include every CI job so this is the only required check in branch rules.
    needs:
      - check-build-src
      - check-dependency-order
      - check-module-boundaries
      - detekt
      - ktfmt
      - android-lint
      - test-android
      - test-desktop
      - test-integration-desktop
      - test-integration-android
      - test-wasm
      - test-ios
      - build-android-release
      - build-desktop
      - build-web-release
      - build-ios-release
      - build-mkdocs
    steps:
      - name: Verify all jobs passed
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS_RESULTS" | jq -e '
            all(to_entries[];
              .value.result == "success" or
              (.key == "build-ios-release" and .value.result == "skipped" and env.GITHUB_REF != "refs/heads/main")
            )'

  check-build-src:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Check buildSrc
        run: ./gradlew $GRADLE_ARGS -p buildSrc release

  check-dependency-order:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Check dependency order
        run: ./gradlew $GRADLE_ARGS checkSortDependencies
      - name: Check buildSrc dependency order
        run: ./gradlew $GRADLE_ARGS -p buildSrc checkSortDependencies

  check-module-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Check module boundaries
        run: ./gradlew $GRADLE_ARGS checkModuleStructureDependencies checkModuleStructureNesting

  detekt:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Detekt
        run: ./gradlew $GRADLE_ARGS detekt

  ktfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Run ktfmt
        run: ./scripts/ktfmt.sh --dry-run --set-exit-if-changed

  android-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Android Lint
        run: ./gradlew $GRADLE_ARGS lint lintAndroidMain
      - name: Upload lint reports
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: android-lint-reports
          path: "**/build/reports/lint-results*"

  test-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Run Android tests
        run: ./gradlew $GRADLE_ARGS testDebugUnitTest testAndroidHostTest

  test-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Run Desktop unit tests
        run: ./gradlew $GRADLE_ARGS desktopTest -x :app:desktop:desktopTest

  test-integration-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Run Desktop integration tests
        run: ./gradlew $GRADLE_ARGS :app:desktop:desktopTest
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-results-${{ github.job }}
          path: "**/build/reports/"

  test-integration-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Prepare emulator
        uses: ./.github/actions/prepare-emulator-action
      - name: Run Android integration tests
        run: ./gradlew $GRADLE_ARGS :app:android:emulatorCheck
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-results-${{ github.job }}
          path: |
            **/build/reports/
            **/build/outputs/androidTest-results/

  test-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Run Wasm tests
        run: ./gradlew $GRADLE_ARGS -Pstorymile.enableWasm=true --no-isolated-projects wasmJsTest

  test-ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          select-xcode-26: "true"
      - name: Run iOS simulator tests
        run: ./gradlew $GRADLE_ARGS iosSimulatorArm64Test
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-results-${{ github.job }}
          path: "**/build/reports/"

  build-android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Prepare emulator
        uses: ./.github/actions/prepare-emulator-action
      - name: Build Android release app
        run: ./gradlew $GRADLE_ARGS :app:android:assembleRelease
      - name: Test Android release app
        run: ./gradlew $GRADLE_ARGS :app:android-blackbox-test:emulatorReleaseAndroidTest
      - name: Upload release APK
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: android-release
          path: app/android/build/outputs/apk/release/*.apk
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results-${{ github.job }}
          path: |
            app/android-blackbox-test/build/reports/
            app/android-blackbox-test/build/outputs/androidTest-results/
            app/android-blackbox-test/build/outputs/managed_device_android_test_additional_output/

  build-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Build Desktop app
        run: ./gradlew $GRADLE_ARGS :app:desktop:desktopMainClasses

  build-web-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Build Wasm web app
        run: ./gradlew $GRADLE_ARGS -Pstorymile.enableWasm=true --no-isolated-projects :app:web:wasmJsBrowserDistribution
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/web/e2e/package-lock.json
      - name: Install browser tests
        working-directory: app/web/e2e
        run: npm ci
      - name: Install Chromium
        working-directory: app/web/e2e
        run: npx playwright install --with-deps chromium
      - name: Verify Wasm app launch
        working-directory: app/web/e2e
        run: npm test
      - name: Upload Wasm distribution
        uses: actions/upload-artifact@v7
        with:
          name: web-release
          path: app/web/build/dist/wasmJs/productionExecutable/
          if-no-files-found: error
      - name: Upload browser test results
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-results-${{ github.job }}
          path: |
            app/web/e2e/playwright-report/
            app/web/e2e/test-results/

  build-mkdocs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build-web-release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-release
          path: app/web/build/dist/wasmJs/productionExecutable/
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation dependencies
        run: python3 -m pip install -r requirements-docs.txt
      - name: Build documentation
        run: python3 scripts/docs/build.py
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/web/e2e/package-lock.json
      - name: Install browser tests
        working-directory: app/web/e2e
        run: npm ci
      - name: Install Chromium
        working-directory: app/web/e2e
        run: npx playwright install --with-deps chromium
      - name: Verify documentation and embedded app
        working-directory: app/web/e2e
        run: npm run test:docs
      - name: Upload documentation site
        uses: actions/upload-artifact@v7
        with:
          name: wiki
          path: site/
          if-no-files-found: error
      - name: Upload documentation test results
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-results-${{ github.job }}
          path: |
            app/web/e2e/playwright-report/
            app/web/e2e/test-results/

  deploy-mkdocs:
    if: ${{ github.repository == 'vRallev/storymile' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-mkdocs
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/download-artifact@v8
        with:
          name: wiki
          path: site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5

  build-ios-release:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          select-xcode-26: "true"
      - name: Build and test Release iOS app
        run: ./scripts/ios-smoke-test.sh
      - name: Upload launch test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: ios-release-launch-test
          path: build/ios-smoke-test/run.*/
