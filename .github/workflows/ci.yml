name: CI

on:
  push:
    branches:
      - main
    tags-ignore:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  # Replace older PR runs; give every main push its own group so none are dropped.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GRADLE_ARGS: --stacktrace --continue --show-version

jobs:
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Report failures, but allow superseded PR runs to cancel this job too.
    if: ${{ !cancelled() }}
    # Include every CI job so this is the only required check in branch rules.
    needs:
      - check-build-src
      - check-dependency-order
      - check-module-boundaries
      - detekt
      - ktfmt
      - android-lint
      - test-android
      - test-desktop
      - test-integration-desktop
      - test-integration-android
      - test-wasm
      - build-android-debug
      - build-desktop
      - build-web
      - build-ios
    steps:
      - name: Verify all jobs passed
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS_RESULTS" | jq -e 'all(.[]; .result == "success")'

  check-build-src:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Check buildSrc
        run: ./gradlew $GRADLE_ARGS -p buildSrc release

  check-dependency-order:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Check dependency order
        run: ./gradlew $GRADLE_ARGS checkSortDependencies
      - name: Check buildSrc dependency order
        run: ./gradlew $GRADLE_ARGS -p buildSrc checkSortDependencies

  check-module-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Check module boundaries
        run: ./gradlew $GRADLE_ARGS checkModuleStructureDependencies checkModuleStructureNesting

  detekt:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Detekt
        run: ./gradlew $GRADLE_ARGS detekt

  ktfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Run ktfmt
        run: ./scripts/ktfmt.sh --dry-run --set-exit-if-changed

  android-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Android Lint
        run: ./gradlew $GRADLE_ARGS lint lintAndroidMain
      - name: Upload lint reports
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: android-lint-reports
          path: "**/build/reports/lint-results*"

  test-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Run Android tests
        run: ./gradlew $GRADLE_ARGS testDebugUnitTest testAndroidHostTest

  test-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Run Desktop unit tests
        run: ./gradlew $GRADLE_ARGS desktopTest -x :app:desktop:desktopTest

  test-integration-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Run Desktop integration tests
        run: ./gradlew $GRADLE_ARGS :app:desktop:desktopTest
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-results-${{ github.job }}
          path: "**/build/reports/"

  test-integration-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Prepare emulator
        uses: ./.github/actions/prepare-emulator-action
      - name: Run Android integration tests
        run: ./gradlew $GRADLE_ARGS :app:android:emulatorCheck
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-results-${{ github.job }}
          path: |
            **/build/reports/
            **/build/outputs/androidTest-results/

  test-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Run Wasm tests
        run: ./gradlew $GRADLE_ARGS wasmJsTest

  build-android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Build Android app
        run: ./gradlew $GRADLE_ARGS :app:android:assembleDebug

  build-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Build Desktop app
        run: ./gradlew $GRADLE_ARGS :app:desktop:desktopMainClasses

  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Build Wasm web app
        run: ./gradlew $GRADLE_ARGS :app:web:wasmJsBrowserDistribution

  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup-action
        with:
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          select-xcode-26: "true"
      - name: Run iOS simulator tests
        run: ./gradlew $GRADLE_ARGS iosSimulatorArm64Test
      - name: Build iOS app
        run: >
          /usr/bin/xcodebuild
          -project app/ios/iosApp.xcodeproj
          -scheme iosApp
          -configuration Debug
          OBJROOT=build/ios
          SYMROOT=build/ios
          -destination 'generic/platform=iOS Simulator'
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
