plugins {
  id 'software.ralf.storymile.library.kmp'
}

storymile {
  enableComposeUi true
  enableMetro true
  enableComposePresenters true
  addImplModuleDependencies true

  // The application graph intentionally imports implementation modules.
  enableModuleStructureDependencyCheck false
}

dependencies {
  commonMainApi project(':storage:public')

  androidMainImplementation libs.androidx.activity.compose

  commonMainImplementation project(':discovery:impl')
  commonMainImplementation project(':downloads:impl')
  commonMainImplementation project(':home:impl')
  commonMainImplementation project(':http:impl')
  commonMainImplementation project(':library:impl')
  commonMainImplementation project(':playback:impl')
  commonMainImplementation project(':player:impl')
  commonMainImplementation project(':playlist:impl')
  commonMainImplementation project(':presenter-navigation:impl')
  commonMainImplementation project(':restart:impl')
  commonMainImplementation project(':rss:impl')
  commonMainImplementation project(':runtime-mode:impl')
  commonMainImplementation project(':storage:impl')
  commonMainImplementation project(':tabs:impl')
  commonMainImplementation project(':templates:impl')
  commonMainImplementation project(':theme:impl')
  commonMainImplementation project(':theme:public')
  commonMainImplementation project(':user:impl')
  commonMainImplementation project(':user:public')
  commonMainImplementation project(':util:impl')
}
