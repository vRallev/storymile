plugins {
  id 'software.ralf.storymile.library.kmp'
}

storymile {
  enableComposeUi true
  enableMetro true
  enableComposePresenters true
  addImplModuleDependencies true
}

dependencies {
  commonMainApi project(':player:public')
  commonMainApi project(':tabs:public')

  androidMainImplementation libs.androidx.test.junit
  androidMainImplementation libs.androidx.test.rules
  androidMainImplementation libs.androidx.test.runner
  androidMainImplementation libs.compose.ui.test.junit4
  androidMainImplementation libs.compose.ui.test.junit4.android

  commonMainImplementation project(':app-framework:impl')
  commonMainImplementation project(':discovery:impl')
  commonMainImplementation project(':discovery:impl-robots')
  commonMainImplementation project(':downloads:impl')
  commonMainImplementation project(':episode-details:impl')
  commonMainImplementation project(':home:impl')
  commonMainImplementation project(':library:impl')
  commonMainImplementation project(':playback:impl')
  commonMainImplementation project(':player:impl')
  commonMainImplementation project(':playlist:impl')
  commonMainImplementation project(':playlist:impl-robots')
  commonMainImplementation project(':playlist:public')
  commonMainImplementation project(':podcast:impl')
  commonMainImplementation project(':podcast:impl-robots')
  commonMainImplementation project(':presenter-navigation:impl')
  commonMainImplementation project(':restart:impl')
  commonMainImplementation project(':runtime-mode:impl-robots')
  commonMainImplementation project(':runtime-mode:public')
  commonMainImplementation project(':storage:impl')
  commonMainImplementation project(':tabs:impl')
  commonMainImplementation project(':templates:impl')
  commonMainImplementation project(':theme:impl')
  commonMainImplementation project(':theme:public')
  commonMainImplementation project(':user:impl')
  commonMainImplementation project(':user:public')
  commonMainImplementation project(':util:impl')
  commonMainImplementation project(':util:public-robots')

  commonTestImplementation project(':restart:public')
  commonTestImplementation project(':runtime-mode:impl')
}
