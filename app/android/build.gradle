plugins {
  id 'software.ralf.storymile.app.android'
}

storymile {
  enableComposeUi true
  enableMetro true
  enableComposePresenters true
  addImplModuleDependencies true
}

android.buildFeatures.buildConfig = true

androidComponents {
  onVariants(selector().withBuildType('release')) { variant ->
    def versionCode = providers.environmentVariable('GITHUB_RUN_NUMBER')
      .orElse(providers.gradleProperty('VERSION_CODE'))
      .map { it.toInteger() }
    variant.outputs.each { it.versionCode.set(versionCode) }
  }
}

dependencies {
  implementation project(':app-framework:impl')
  implementation project(':util:impl')

  // Android tests inherit strict versions from the app runtime.
  implementation libs.androidx.concurrent.futures
  implementation libs.process.phoenix

  androidTestImplementation project(':app-framework:impl-ui-test-robots')
  androidTestImplementation project(':playlist:impl-robots')
}
