site_name: Storymile
site_url: https://vrallev.github.io/storymile/
site_description: A podcast app built with Kotlin Multiplatform and App Platform.
repo_name: vRallev/storymile
repo_url: https://github.com/vRallev/storymile
copyright: Copyright 2026 Ralf Wondratschek. Licensed under Apache-2.0.

theme:
  name: material
  custom_dir: scripts/docs/overrides
  logo: assets/icon.png
  favicon: assets/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: Fira Code
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - toc.follow
    - toc.integrate
    - content.code.copy

nav:
  - Home: index.md
  - Presenter hierarchy: presenter-hierarchy.md
  - Design research: design-research.md

plugins:
  - search

hooks:
  - scripts/docs/hooks.py

extra_css:
  - stylesheets/site.css

extra_javascript:
  - javascripts/app-preview.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
