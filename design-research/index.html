<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Storymile / Design research</title>
  <script>
    (() => {
      const root = document.documentElement;
      const parentBody = window.frameElement?.ownerDocument.body;
      const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
      const updateTheme = () => {
        const scheme = parentBody?.getAttribute('data-md-color-scheme');
        root.dataset.theme = scheme === 'slate' ? 'dark'
          : scheme === 'default' ? 'light'
          : systemTheme.matches ? 'dark' : 'light';
      };
      updateTheme();
      systemTheme.addEventListener('change', updateTheme);
      if (parentBody) {
        new MutationObserver(updateTheme).observe(parentBody, {
          attributes: true,
          attributeFilter: ['data-md-color-scheme'],
        });
      }
    })();
  </script>
  <style>
    :root { color-scheme:light; --paper:#f7f3eb; --surface:#fffdf8; --ink:#233b50; --muted:#5b6e79; --line:#d7ddd9; --blue:#365f7d; --selected:#dce8ee; --tab-background:#233b50; --tab-text:#fffdf8; --image-outline:#233b501c; --backdrop:#0f202ddd; }
    :root[data-theme="dark"] { color-scheme:dark; --paper:#0f202d; --surface:#182f40; --ink:#f4efe5; --muted:#afbfca; --line:#405664; --blue:#acc9dc; --selected:#294c63; --tab-background:#294c63; --tab-text:#f4efe5; --image-outline:#405664; --backdrop:#0a1924e8; }
    * { box-sizing:border-box; }
    [hidden] { display:none!important; }
    body { margin:0; background:var(--paper); color:var(--ink); font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,a,input { -webkit-tap-highlight-color:transparent; }
    button { font:inherit; cursor:pointer; }
    button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible { outline:3px solid var(--blue); outline-offset:4px; }
    a { color:var(--blue); text-underline-offset:3px; }
    .wrap { width:100%; margin:auto; padding:0 28px; }
    .masthead { position:sticky; top:0; z-index:10; background:var(--paper); border-bottom:1px solid var(--line); }
    .topline { min-height:62px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { display:inline-flex; align-items:center; gap:9px; color:var(--ink); text-decoration:none; font-size:18px; font-weight:700; letter-spacing:-.4px; white-space:nowrap; }
    .brand img { display:block; width:46px; height:34px; object-fit:cover; }
    .brand .brand-icon--dark,:root[data-theme="dark"] .brand .brand-icon--light { display:none; }
    :root[data-theme="dark"] .brand .brand-icon--dark { display:block; }
    .brand span { font-size:14px; font-weight:400; color:var(--muted); letter-spacing:0; }
    .tabs { display:flex; gap:5px; }
    .tab,.control { border:1px solid transparent; border-radius:7px; padding:8px 13px; color:var(--muted); background:transparent; white-space:nowrap; }
    .tab[aria-selected="true"] { background:var(--tab-background); color:var(--tab-text); }
    .filterbar { display:flex; align-items:center; flex-wrap:wrap; min-height:43px; gap:8px 20px; padding-bottom:9px; }
    .filter-group { display:flex; flex-wrap:wrap; align-items:center; gap:8px 20px; }
    .filter-group + .filter-group { padding-left:20px; border-left:1px solid var(--line); }
    .filter { display:inline-flex; align-items:center; gap:7px; padding:4px 0; font-size:12px; cursor:pointer; }
    .filter input { width:16px; height:16px; margin:0; accent-color:var(--blue); cursor:pointer; }
    .tab:hover:not([aria-selected="true"]) { border-color:var(--line); }
    main { min-height:60vh; }
    #gallery { padding-top:28px; }
    .study { margin:0 0 56px; }
    .study-header { display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:6px 20px; margin-bottom:14px; }
    h1,h2,h3,p,figure { margin:0; }
    .study-title { font-size:19px; line-height:1.25; font-weight:650; letter-spacing:-.3px; }
    .metadata { color:var(--muted); font-size:12px; }
    .difference { color:var(--muted); margin:-3px 0 16px; font-size:13px; max-width:1100px; }
    .sources { display:inline-flex; flex-wrap:wrap; gap:12px; margin-left:12px; font-size:11px; }
    .matrix-scroll { overflow-x:auto; padding:3px 3px 12px; }
    .theme-table { width:max-content; margin:auto; }
    .theme-columns,.theme-row { display:grid; grid-template-columns:var(--columns); gap:20px; }
    .theme-columns { margin-bottom:22px; text-align:center; color:var(--muted); font-size:12px; }
    .theme-columns > div { min-width:0; overflow-wrap:anywhere; }
    .column-title { min-height:32px; text-align:center; font-size:13px; font-weight:600; }
    .theme-slot .theme-labels { margin-bottom:8px; text-align:center; }
    .theme-labels { display:grid; grid-template-columns:repeat(var(--theme-count),minmax(0,1fr)); gap:8px; margin-top:6px; color:var(--ink); font-size:11px; }
    .theme-table .study { padding-bottom:24px; margin-bottom:24px; border-bottom:1px solid var(--line); }
    .theme-table .study:last-child { border-bottom:0; }
    .theme-table .study-header { margin-bottom:12px; }
    .device-pair { display:grid; grid-template-columns:repeat(var(--theme-count),minmax(0,1fr)); align-items:center; gap:8px; min-width:0; }
    .screen { min-width:0; }
    .preview { display:flex; align-items:center; justify-content:center; height:var(--preview-height,50vh); }
    .image-button { position:relative; display:block; width:calc(var(--preview-height,50vh)*var(--aspect-ratio)); height:var(--preview-height,50vh); flex-shrink:0; border:0; padding:0; background:var(--surface); box-shadow:0 0 0 1px var(--image-outline); }
    .image-button img { display:block; width:100%; height:100%; }
    .image-button:not([data-load-state="loaded"]) img,.image-stage img:not([data-load-state="loaded"]) { visibility:hidden; }
    .image-state { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); font-size:11px; }
    .image-button[data-load-state="loaded"] .image-state { display:none; }
    .image-button[data-load-state="error"] { background:var(--selected); }
    .animated-preview { position:fixed; z-index:2; pointer-events:none; transform-origin:top left; box-shadow:0 0 0 1px var(--image-outline); will-change:transform,opacity; }
    .screen-placeholder { height:var(--preview-height,50vh); }
    .pair-scroll,.flow-scroll { overflow-x:auto; padding:3px 3px 12px; }
    .pair { display:grid; grid-template-columns:var(--columns); gap:28px; width:max-content; margin:auto; align-items:start; }
    .flow-strip { display:grid; grid-template-columns:var(--columns); align-items:start; gap:24px; width:max-content; margin:auto; }
    .flow-row + .flow-row { margin-top:24px; }
    .flow-device { margin-bottom:10px; color:var(--muted); font-size:12px; font-weight:500; }
    .empty { padding:70px 0; color:var(--muted); text-align:center; }
    .footer { border-top:1px solid var(--line); padding:18px 0 26px; font-size:12px; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    dialog { width:calc(100vw - 28px); height:calc(100dvh - 28px); max-width:1800px; max-height:none; padding:0; margin:auto; border:1px solid var(--line); border-radius:12px; background:var(--paper); color:var(--ink); overflow:hidden; }
    dialog::backdrop { background:var(--backdrop); }
    .viewer { display:flex; flex-direction:column; height:100%; }
    .viewer-header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; flex-shrink:0; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--surface); }
    .viewer-header h2 { font-size:15px; line-height:1.3; font-weight:600; }
    .viewer-controls { display:flex; flex-shrink:0; gap:7px; margin-left:auto; }
    .control { border-color:var(--line); color:var(--ink); font-size:12px; padding:7px 11px; }
    .control:hover { background:var(--selected); }
    .viewer-body { position:relative; display:flex; flex:1; min-height:0; }
    .viewer-nav { position:absolute; top:50%; transform:translateY(-50%); z-index:1; display:grid; place-items:center; width:44px; height:44px; padding:0; border:1px solid var(--line); border-radius:50%; color:var(--ink); background:var(--surface); }
    .viewer-nav:hover:not(:disabled) { background:var(--selected); }
    .viewer-nav:disabled { opacity:.35; cursor:default; }
    #viewer-previous { left:12px; }
    #viewer-next { right:12px; }
    .image-scroll { min-height:0; min-width:0; flex:1; overflow:auto; padding:16px 72px; overscroll-behavior:contain; }
    .image-stage { position:relative; display:flex; align-items:center; justify-content:center; width:100%; height:100%; }
    .viewer-loading,.viewer-retry { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); }
    .image-stage img { display:block; width:auto; height:auto; max-width:100%; max-height:100%; object-fit:contain; }
    .image-scroll.actual .image-stage { display:block; width:max-content; height:max-content; min-width:100%; min-height:100%; }
    .image-scroll.actual img { max-width:none; max-height:none; }
    @media(max-width:760px) { .wrap { padding:0 16px; } .topline { align-items:flex-start; flex-direction:column; gap:8px; padding-top:10px; padding-bottom:8px; } .brand { font-size:17px; } .brand img { width:40px; height:29px; } .tabs { width:100%; } .tab { flex:1; padding:7px 10px; } .filterbar { padding-bottom:7px; min-height:39px; } #gallery { padding-top:23px; } .study { margin-bottom:38px; } .study-title { font-size:17px; } .study-header { margin-bottom:12px; } .pair { gap:20px; } .theme-columns,.theme-row { gap:12px; } .sources { margin-left:8px; } .viewer-header { gap:10px; padding:10px; } .viewer-header h2 { font-size:13px; } .viewer-controls { gap:4px; } .control { padding:7px 9px; } dialog { width:calc(100vw - 10px); height:calc(100dvh - 10px); border-radius:8px; } .image-scroll { padding:10px 56px; } #viewer-previous { left:5px; } #viewer-next { right:5px; } }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <div class="topline">
        <a class="brand" href="#"><img class="brand-icon--light" src="../images/icon-light.svg" alt="" width="46" height="34"><img class="brand-icon--dark" src="../images/icon-dark.svg" alt="" width="46" height="34">Storymile <span>/ Design research</span></a>
        <div class="tabs" role="tablist" aria-label="Design views">
          <button class="tab" id="tab-themes" role="tab" type="button" aria-selected="true" aria-controls="gallery" tabindex="0" data-view="themes">Themes</button>
          <button class="tab" id="tab-platforms" role="tab" type="button" aria-selected="false" aria-controls="gallery" tabindex="-1" data-view="platforms">Android / iOS</button>
          <button class="tab" id="tab-flows" role="tab" type="button" aria-selected="false" aria-controls="gallery" tabindex="-1" data-view="flows">Flows</button>
        </div>
      </div>
      <div class="filterbar" id="device-filters" role="group" aria-label="Mock filters"></div>
    </div>
  </header>
  <main class="wrap">
    <h1 class="sr-only">Storymile screen designs</h1>
    <div id="gallery" role="tabpanel" aria-labelledby="tab-themes" tabindex="0"></div>
    <p id="status" class="sr-only" role="status" aria-live="polite"></p>
    <footer class="footer"><a href="prompts.json">Prompts</a></footer>
  </main>
  <dialog id="image-dialog" aria-labelledby="viewer-title">
    <div class="viewer">
      <header class="viewer-header"><h2 id="viewer-title">Screen</h2><div class="viewer-controls"><button id="viewer-size" class="control" type="button" aria-pressed="false">Actual size</button><button id="viewer-close" class="control" type="button">Close</button></div></header>
      <div class="viewer-body">
        <button id="viewer-previous" class="viewer-nav" type="button" aria-label="Previous image" aria-keyshortcuts="ArrowLeft" title="Previous image (←)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="m15 6-6 6 6 6"/></svg></button>
        <div id="image-scroll" class="image-scroll" tabindex="0" aria-label="Screen preview; scroll in actual size"><div id="image-stage" class="image-stage"></div></div>
        <button id="viewer-next" class="viewer-nav" type="button" aria-label="Next image" aria-keyshortcuts="ArrowRight" title="Next image (→)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="m9 6 6 6-6 6"/></svg></button>
      </div>
      <p id="viewer-status" class="sr-only" role="status" aria-live="polite"></p>
    </div>
  </dialog>
  <script src="data.js"></script>
  <script src="image-loader.js"></script>
  <script>
    (() => {
      'use strict';
      const data = window.STORYMILE_DESIGN || {};
      const list = value => Array.isArray(value) ? value : [];
      const screens = new Map(list(data.screens).filter(screen => screen && screen.id && screen.file).map(screen => [screen.id,screen]));
      const deviceNames = {'phone-portrait':'Phone portrait','phone-landscape':'Phone landscape','tablet-portrait':'Tablet portrait','tablet-landscape':'Tablet landscape',foldable:'Foldable',desktop:'Desktop'};
      const platformNames = {android:'Android',ios:'iOS',desktop:'Desktop'};
      const filterNames = Object.entries(deviceNames);
      const deviceOrder = Object.keys(deviceNames);
      const state = {view:'themes',devices:new Set(deviceOrder),themes:new Set(['light','dark']),returnFocus:null,bodyOverflow:''};
      const viewer = {items:[],index:-1};
      const selectedThemes = () => ['light','dark'].filter(theme => state.themes.has(theme));
      const themeVariants = new Map([...list(data.themePairs),...list(data.platformThemePairs)].flatMap(pair => [[pair.light,pair],[pair.dark,pair]]));
      const byId = id => document.getElementById(id);
      const gallery = byId('gallery');
      const dialog = byId('image-dialog');
      const node = (tag,className,text) => {
        const result = document.createElement(tag);
        if (className) result.className = className;
        if (text !== undefined) result.textContent = String(text);
        return result;
      };
      const localAsset = value => typeof value === 'string' && !/^(?:[a-z][a-z0-9+.-]*:|\/|\\)/i.test(value) && !value.split('/').includes('..') ? value : '';
      const pairScreens = pair => [screens.get(pair.android),screens.get(pair.ios)];
      const pairs = () => list(data.platformPairs).filter(pair => pair && pairScreens(pair).every(Boolean));
      const variant = (screen,theme) => screen.theme === theme ? screen : screens.get(themeVariants.get(screen.id)?.[theme]);
      const flows = () => list(data.flows).filter(flow => flow && list(flow.screens).some(id => screens.has(id)));
      const availableScreens = () => {
        const candidates = state.view === 'themes'
          ? list(data.themePairs).flatMap(pair => [screens.get(pair.light),screens.get(pair.dark)])
          : state.view === 'platforms'
            ? pairs().flatMap(pairScreens)
            : flows().flatMap(flow => list(flow.screens).map(id => screens.get(id)));
        return candidates.filter(Boolean).flatMap(screen => ['light','dark'].map(theme => variant(screen,theme)).filter(Boolean));
      };
      const frameAspects = new Map();
      for (const screen of screens.values()) {
        const key = screen.platform + ':' + screen.device;
        frameAspects.set(key,Math.max(frameAspects.get(key) || 0,screen.width / screen.height));
      }
      const frameAspect = screen => frameAspects.get(screen.platform + ':' + screen.device);
      const layouts = [];
      const previewAnimations = new Map();
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const previewLoader = new StorymileImageLoader();
      const fullSizeLoader = new StorymileImageLoader({concurrency:1});
      const previewImages = new Map();
      let imageRefresh = 0;
      let animationScroll = {x:0,y:0};

      function image(screen) {
        const img = node('img');
        img.alt = [screen.title,platformNames[screen.platform] || screen.platform,screen.theme && screen.theme + ' mode',deviceNames[screen.device] || screen.device].filter(Boolean).join(' — ');
        if (Number.isFinite(screen.width) && screen.width > 0) img.width = screen.width;
        if (Number.isFinite(screen.height) && screen.height > 0) img.height = screen.height;
        return img;
      }

      function previewState(img,loadState) {
        img.dataset.loadState = loadState;
        const button = img.parentElement;
        if (!button) return;
        button.dataset.loadState = loadState;
        button.setAttribute('aria-busy',String(loadState === 'queued' || loadState === 'loading'));
        button.setAttribute('aria-label',`${loadState === 'error' ? 'Retry loading' : 'Enlarge'} ${img.alt}`);
        button.querySelector('.image-state').textContent = loadState === 'error' ? 'Retry' : '…';
      }

      function refreshImages() {
        imageRefresh = 0;
        // Measure buttons after layout. Temporary FLIP visibility does not change their bounds.
        const measured = [...previewImages].map(([key,entry]) => ({key,...entry,rect:entry.img.isConnected ? entry.img.parentElement.getBoundingClientRect() : null}));
        previewLoader.batch(() => {
          for (const {key,img,screen,rect} of measured) {
            if (!rect) {
              previewLoader.release(img); previewImages.delete(key); continue;
            }
            const distance = Math.max(0,-rect.bottom,rect.top - window.innerHeight,-rect.right,rect.left - window.innerWidth);
            if (distance > 800 || (distance > 200 && previewLoader.state(img) !== 'loaded') || !rect.width || !rect.height) {
              previewLoader.release(img); previewState(img,'idle'); continue;
            }
            // Keep a small buffer of decoded images; only start work near the viewport.
            if (distance > 200) continue;
            const density = window.devicePixelRatio || 1;
            const smallEnough = rect.width * density <= 640 && rect.height * density <= 360;
            const previewEnough = rect.width * density <= 1280 && rect.height * density <= 720;
            const src = localAsset(smallEnough && screen.thumbnail) || localAsset(previewEnough && screen.preview) || localAsset(screen.file);
            previewLoader.load(img,src,{priority:1000 - distance,onState:loadState => previewState(img,loadState)});
          }
        });
      }

      function scheduleImages() {
        if (!imageRefresh) imageRefresh = requestAnimationFrame(refreshImages);
      }

      function screenFigure(screen,context) {
        const figure = node('figure','screen');
        figure.dataset.device = screen.device;
        figure.style.setProperty('--aspect-ratio',screen.width / screen.height);
        const button = node('button','image-button');
        const key = context + ':' + screen.id;
        button.dataset.motionKey = key;
        button.dataset.screenId = screen.id;
        button.type = 'button';
        button.setAttribute('aria-label',`Enlarge ${screen.title}, ${platformNames[screen.platform] || screen.platform}, ${screen.theme} mode`);
        // Reuse loaded nodes when filters change instead of restarting every image request.
        const img = previewImages.get(key)?.img || image(screen);
        previewImages.set(key,{img,screen});
        const status = node('span','image-state');
        status.setAttribute('aria-hidden','true');
        button.append(img,status);
        previewState(img,previewLoader.state(img));
        button.addEventListener('click',() => {
          if (previewLoader.state(img) === 'error') previewLoader.retry(img);
          else openImage(button);
        });
        const preview = node('div','preview');
        preview.append(button);
        figure.append(preview);
        return figure;
      }

      function heading(title,metadata) {
        const header = node('header','study-header');
        header.append(node('h2','study-title',title));
        if (metadata) header.append(node('p','metadata',metadata));
        return header;
      }

      function themeRows() {
        const rows = new Map();
        const titles = {'Now playing':'Player',Discovery:'Show'};
        for (const pair of list(data.themePairs)) {
          if (!pair || !screens.has(pair.light) || !screens.has(pair.dark)) continue;
          const title = titles[pair.title] || pair.title;
          if (!rows.has(title)) rows.set(title,{title,devices:new Map()});
          rows.get(title).devices.set(pair.device,pair);
        }
        return [...rows.values()];
      }

      function renderThemes() {
        const devices = deviceOrder.filter(device => state.devices.has(device));
        const themes = selectedThemes();
        if (!devices.length || !themes.length) return 0;
        const scroll = node('div','matrix-scroll');
        scroll.tabIndex = 0;
        scroll.setAttribute('role','region');
        scroll.setAttribute('aria-label','Screen sizes with selected themes side by side');
        const table = node('div','theme-table');
        table.style.setProperty('--theme-count',themes.length);
        const columns = node('div','theme-columns');
        for (const device of devices) {
          const column = node('div','',deviceNames[device]);
          const labels = node('div','theme-labels');
          for (const theme of themes) labels.append(node('span','',theme === 'light' ? 'Light' : 'Dark'));
          column.append(labels); columns.append(column);
        }
        table.append(columns);
        const aspects = devices.map(device => frameAspects.get((device === 'desktop' ? 'desktop' : 'android') + ':' + device));
        layouts.push({container:table,scroll,grid:columns,aspects});
        let count = 0;
        for (const row of themeRows()) {
          if (!devices.some(device => row.devices.has(device))) continue;
          const study = node('section','study');
          study.append(heading(row.title));
          const grid = node('div','theme-row');
          for (const device of devices) {
            const slot = node('div','device-pair');
            slot.dataset.device = device;
            const pair = row.devices.get(device);
            if (pair) {
              for (const theme of themes) slot.append(screenFigure(screens.get(pair[theme]),'theme:' + row.title));
            } else {
              slot.classList.add('screen-placeholder');
              slot.setAttribute('aria-hidden','true');
            }
            grid.append(slot);
          }
          study.append(grid); table.append(study); count++;
        }
        if (count) { scroll.append(table); gallery.append(scroll); }
        return count;
      }

      function themeSlot(screen,context) {
        const slot = node('div','theme-slot');
        slot.style.setProperty('--theme-count',state.themes.size);
        const labels = node('div','theme-labels');
        const grid = node('div','device-pair');
        for (const theme of selectedThemes()) {
          labels.append(node('span','',theme === 'light' ? 'Light' : 'Dark'));
          const mock = variant(screen,theme);
          if (mock) grid.append(screenFigure(mock,context));
          else {
            const blank = node('div','screen-placeholder');
            blank.setAttribute('aria-hidden','true'); grid.append(blank);
          }
        }
        slot.append(labels,grid);
        return slot;
      }

      function renderPlatformPair(pair) {
        const [left,right] = pairScreens(pair);
        const study = node('section','study');
        study.append(heading(pair.title,deviceNames[left.device] || left.device));
        if (pair.note) {
          const note = node('p','difference',pair.note);
          const sources = node('span','sources');
          for (const source of list(pair.sources)) {
            if (!source || !/^https?:\/\//i.test(source.url)) continue;
            const link = node('a','',source.label || 'Source');
            link.href = source.url; link.target = '_blank'; link.rel = 'noopener noreferrer';
            sources.append(link);
          }
          if (sources.childNodes.length) note.append(sources);
          study.append(note);
        }
        const scroll = node('div','pair-scroll');
        scroll.tabIndex = 0;
        scroll.setAttribute('role','region');
        scroll.setAttribute('aria-label',`${pair.title}: Android on the left, iOS on the right`);
        const pairGrid = node('div','pair');
        for (const screen of [left,right]) {
          const column = node('div');
          column.append(node('p','column-title',platformNames[screen.platform]),themeSlot(screen,'platform:' + pair.id));
          pairGrid.append(column);
        }
        layouts.push({container:pairGrid,scroll,grid:pairGrid,aspects:[frameAspect(left),frameAspect(right)],scale:left.device === 'phone-portrait' ? 2 : 1});
        scroll.append(pairGrid); study.append(scroll); gallery.append(study);
      }

      function renderFlow(flow) {
        const flowScreens = list(flow.screens).map(id => screens.get(id)).filter(Boolean);
        const stepTitles = flowScreens.filter(screen => screen.device === 'phone-portrait').map(screen => screen.title);
        const rows = deviceOrder.filter(device => state.devices.has(device)).map(device => ({
          device,
          items:flowScreens.filter(screen => screen.device === device).map((screen,index) => ({screen,step:index + 1})).filter(item => selectedThemes().some(theme => variant(item.screen,theme)))
        })).filter(row => row.items.length);
        if (!rows.length) return false;
        const study = node('section','study');
        study.append(heading(flow.title));
        for (const {device,items} of rows) {
          const row = node('div','flow-row');
          row.append(node('h3','flow-device',deviceNames[device]));
          const scroll = node('div','flow-scroll');
          scroll.tabIndex = 0;
          scroll.setAttribute('role','region');
          scroll.setAttribute('aria-label',`${flow.title}, ${deviceNames[device]}: screens in order`);
          const strip = node('div','flow-strip');
          for (const item of items) {
            const step = node('div');
            const title = stepTitles[item.step - 1] || item.screen.title;
            step.append(node('p','column-title',`${item.step}. ${title}`),themeSlot(item.screen,'flow:' + flow.id + ':' + device + ':' + item.step));
            strip.append(step);
          }
          layouts.push({container:strip,scroll,grid:strip,aspects:items.map(item => frameAspect(item.screen)),fillWidth:true});
          scroll.append(strip); row.append(scroll); study.append(row);
        }
        gallery.append(study);
        return true;
      }

      function renderFilters() {
        const filters = byId('device-filters');
        const available = availableScreens();
        const devices = new Set(available.map(screen => screen.device));
        const themes = new Set(available.map(screen => screen.theme));
        filters.replaceChildren();
        for (const [title,options,selection,visible] of [
          ['Devices',filterNames,state.devices,devices],
          ['Themes',[['light','Light'],['dark','Dark']],state.themes,themes]
        ]) {
          const group = node('div','filter-group');
          group.setAttribute('role','group'); group.setAttribute('aria-label',title);
          for (const [value,text] of options) {
            if (!visible.has(value)) continue;
            const label = node('label','filter');
            const input = node('input');
            input.type = 'checkbox'; input.value = value; input.checked = selection.has(value);
            input.addEventListener('change',() => {
              if (input.checked) selection.add(value);
              else selection.delete(value);
              animateFilterChange();
            });
            label.append(input,node('span','',text)); group.append(label);
          }
          if (group.childNodes.length) filters.append(group);
        }
      }

      function fitPreviews() {
        scheduleImages();
        if (!layouts.length || !state.themes.size) return;
        const themeCount = state.themes.size;
        const innerGap = 8 * (themeCount - 1);
        const usableHeight = Math.max(1,window.innerHeight - document.querySelector('.masthead').offsetHeight - 210);
        const widthLimits = layouts.map(layout => {
          const style = getComputedStyle(layout.scroll);
          const available = layout.scroll.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
          const gap = parseFloat(getComputedStyle(layout.grid).columnGap) || 0;
          const gaps = gap * (layout.aspects.length - 1) + innerGap * layout.aspects.length;
          return (available - gaps) / (themeCount * layout.aspects.reduce((sum,aspect) => sum + aspect,0));
        });
        const height = Math.max(1,Math.min(usableHeight,...widthLimits));
        gallery.style.setProperty('--preview-height',height + 'px');
        for (const [index,layout] of layouts.entries()) {
          const rowHeight = Math.max(1,layout.fillWidth ? widthLimits[index] : Math.min(height * (layout.scale || 1),usableHeight,widthLimits[index]));
          layout.container.style.setProperty('--preview-height',rowHeight + 'px');
          const columns = layout.aspects.map(aspect => (rowHeight * aspect * themeCount + innerGap) + 'px');
          layout.container.style.setProperty('--columns',columns.join(' '));
        }
      }

      function render() {
        layouts.length = 0;
        gallery.replaceChildren();
        let count = 0;
        if (state.view === 'themes') {
          count = renderThemes();
        } else if (state.view === 'flows') {
          for (const flow of flows()) if (renderFlow(flow)) count++;
        } else {
          for (const pair of pairs()) if (pairScreens(pair).some(screen => state.devices.has(screen.device) && selectedThemes().some(theme => variant(screen,theme)))) { renderPlatformPair(pair); count++; }
        }
        if (!count) gallery.append(node('p','empty',!state.devices.size ? 'Select a device to show mocks.' : !state.themes.size ? 'Select a theme to show mocks.' : 'No mocks for this selection in this view.'));
        gallery.setAttribute('aria-labelledby','tab-' + state.view);
        byId('status').textContent = `${count} ${state.view === 'flows' ? 'flows' : 'screen rows'} shown.`;
        fitPreviews();
      }

      function stopPreviewAnimations() {
        for (const entry of previewAnimations.values()) {
          entry.animation.cancel();
          entry.image.remove();
          entry.target?.style.removeProperty('visibility');
        }
        previewAnimations.clear();
      }

      function previewSnapshot(element,image) {
        return {rect:element.getBoundingClientRect(),opacity:Number(getComputedStyle(element).opacity),image};
      }

      function animateFilterChange() {
        if (reducedMotion.matches || typeof document.body.animate !== 'function') {
          stopPreviewAnimations(); render(); return;
        }
        const previous = new Map();
        for (const button of gallery.querySelectorAll('[data-motion-key]')) {
          previous.set(button.dataset.motionKey,previewSnapshot(button,button.querySelector('img')));
        }
        // Continue rapid toggles from the currently animated position, including departing mocks.
        for (const [key,entry] of previewAnimations) previous.set(key,previewSnapshot(entry.image,entry.image));
        stopPreviewAnimations();
        render();
        gallery.getBoundingClientRect();
        animationScroll = {x:window.scrollX,y:window.scrollY};
        const next = new Map([...gallery.querySelectorAll('[data-motion-key]')].map(button => [button.dataset.motionKey,button]));
        const visible = rect => rect.width > 0 && rect.height > 0 && rect.bottom > 0 && rect.top < window.innerHeight && rect.right > 0 && rect.left < window.innerWidth;
        for (const key of new Set([...previous.keys(),...next.keys()])) {
          const before = previous.get(key);
          const target = next.get(key);
          const after = target && previewSnapshot(target,target.querySelector('img'));
          if (!(before && visible(before.rect)) && !(after && visible(after.rect))) continue;
          const loadedImage = [before?.image,after?.image].find(img => img?.complete && img.naturalWidth > 0);
          if (!loadedImage) continue;
          const destination = after || before;
          const rect = destination.rect;
          const snapshot = loadedImage.cloneNode(false);
          snapshot.removeAttribute('style');
          snapshot.className = 'animated-preview';
          snapshot.alt = ''; snapshot.setAttribute('aria-hidden','true');
          snapshot.loading = 'eager';
          Object.assign(snapshot.style,{left:rect.left + 'px',top:rect.top + 'px',width:rect.width + 'px',height:rect.height + 'px'});
          document.body.append(snapshot);
          if (target) target.style.visibility = 'hidden';
          const from = before && after
            ? `translate(${before.rect.left - rect.left}px,${before.rect.top - rect.top}px) scale(${before.rect.width / rect.width},${before.rect.height / rect.height})`
            : 'none';
          const animation = snapshot.animate([
            {transform:from,opacity:before ? before.opacity : 0},
            {transform:'none',opacity:after ? 1 : 0}
          ],{duration:300,easing:'cubic-bezier(0.22, 1, 0.36, 1)',fill:'both'});
          const entry = {image:snapshot,target,animation};
          previewAnimations.set(key,entry);
          const finish = () => {
            if (previewAnimations.get(key) !== entry) return;
            snapshot.remove(); target?.style.removeProperty('visibility');
            previewAnimations.delete(key);
          };
          animation.finished.then(finish,finish);
        }
      }

      function activateTab(tab) {
        stopPreviewAnimations();
        state.view = tab.dataset.view;
        for (const item of document.querySelectorAll('[data-view]')) {
          const active = item === tab;
          item.setAttribute('aria-selected',String(active)); item.tabIndex = active ? 0 : -1;
        }
        renderFilters(); render(); window.scrollTo({top:0,behavior:'instant'});
      }

      function showViewerImage() {
        const screen = viewer.items[viewer.index].screen;
        const title = `${screen.title} · ${platformNames[screen.platform] || screen.platform} · ${screen.theme} · ${deviceNames[screen.device] || screen.device}`;
        byId('viewer-title').textContent = title;
        fullSizeLoader.clear();
        const img = image(screen);
        const loading = node('span','viewer-loading','Loading…');
        const retry = node('button','control viewer-retry','Retry image');
        retry.type = 'button'; retry.hidden = true;
        retry.addEventListener('click',() => { fullSizeLoader.retry(img); byId('viewer-close').focus(); });
        const stage = byId('image-stage');
        stage.replaceChildren(img,loading,retry);
        fullSizeLoader.load(img,localAsset(screen.file),{onState:loadState => {
          img.dataset.loadState = loadState;
          loading.hidden = loadState === 'loaded' || loadState === 'error';
          retry.hidden = loadState !== 'error';
          stage.setAttribute('aria-busy',String(loadState === 'queued' || loadState === 'loading'));
        }});
        byId('image-scroll').scrollTo(0,0);
        byId('viewer-status').textContent = `Image ${viewer.index + 1} of ${viewer.items.length}: ${title}`;
        const previous = byId('viewer-previous');
        const next = byId('viewer-next');
        const focused = document.activeElement;
        previous.disabled = viewer.index === 0;
        next.disabled = viewer.index === viewer.items.length - 1;
        if (focused === previous && previous.disabled) (next.disabled ? byId('viewer-close') : next).focus();
        if (focused === next && next.disabled) (previous.disabled ? byId('viewer-close') : previous).focus();
      }

      function moveImage(direction) {
        if (!dialog.open) return;
        const index = viewer.index + direction;
        if (index < 0 || index >= viewer.items.length) return;
        viewer.index = index;
        showViewerImage();
      }

      function openImage(button) {
        viewer.items = [...gallery.querySelectorAll('.image-button')].map(button => ({button,screen:screens.get(button.dataset.screenId)})).filter(item => item.screen);
        viewer.index = viewer.items.findIndex(item => item.button === button);
        if (viewer.index < 0) return;
        stopPreviewAnimations();
        state.returnFocus = button;
        state.bodyOverflow = document.body.style.overflow;
        byId('image-scroll').classList.remove('actual');
        byId('viewer-size').textContent = 'Actual size'; byId('viewer-size').setAttribute('aria-pressed','false');
        showViewerImage();
        dialog.showModal(); document.body.style.overflow = 'hidden'; byId('viewer-close').focus();
      }

      const tabs = [...document.querySelectorAll('[data-view]')];
      for (const tab of tabs) {
        tab.addEventListener('click',() => activateTab(tab));
        tab.addEventListener('keydown',event => {
          let index = tabs.indexOf(tab);
          if (event.key === 'ArrowRight') index = (index + 1) % tabs.length;
          else if (event.key === 'ArrowLeft') index = (index + tabs.length - 1) % tabs.length;
          else if (event.key === 'Home') index = 0;
          else if (event.key === 'End') index = tabs.length - 1;
          else return;
          event.preventDefault(); activateTab(tabs[index]); tabs[index].focus();
        });
      }
      byId('viewer-size').addEventListener('click',() => {
        const scroll = byId('image-scroll');
        const actual = scroll.classList.toggle('actual');
        byId('viewer-size').textContent = actual ? 'Fit to view' : 'Actual size';
        byId('viewer-size').setAttribute('aria-pressed',String(actual)); scroll.scrollTo(0,0);
      });
      byId('viewer-close').addEventListener('click',() => dialog.close());
      byId('viewer-previous').addEventListener('click',() => moveImage(-1));
      byId('viewer-next').addEventListener('click',() => moveImage(1));
      dialog.addEventListener('keydown',event => {
        if (!dialog.open || event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
        if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
        event.preventDefault();
        moveImage(event.key === 'ArrowLeft' ? -1 : 1);
      });
      dialog.addEventListener('click',event => { if (event.target === dialog) dialog.close(); });
      dialog.addEventListener('close',() => {
        document.body.style.overflow = state.bodyOverflow;
        if (state.returnFocus?.isConnected) state.returnFocus.focus({preventScroll:true});
        viewer.items = []; viewer.index = -1;
        fullSizeLoader.clear();
        byId('image-stage').replaceChildren();
        byId('viewer-status').textContent = '';
      });
      renderFilters();
      render();
      new ResizeObserver(fitPreviews).observe(gallery);
      window.addEventListener('resize',() => { stopPreviewAnimations(); fitPreviews(); });
      window.addEventListener('scroll',event => {
        scheduleImages();
        if (event.target === document || event.target === window) {
          if (window.scrollX === animationScroll.x && window.scrollY === animationScroll.y) return;
        } else if (!event.target.isConnected) return;
        stopPreviewAnimations();
      },{capture:true,passive:true});
      reducedMotion.addEventListener('change',stopPreviewAnimations);
    })();
  </script>
</body>
</html>
