pluginManagement {
  repositories {
    google {
      content {
        includeGroupAndSubgroups 'androidx'
        includeGroupAndSubgroups 'com.android'
        includeGroup 'com.google.testing.platform'
      }
    }
    mavenCentral()
  }
}

dependencyResolutionManagement {
  repositories {
    google {
      content {
        includeGroupAndSubgroups 'androidx'
        includeGroupAndSubgroups 'com.android'
        includeGroup 'com.google.testing.platform'
      }
    }
    mavenCentral()
    gradlePluginPortal {
      content {
        includeModule 'io.github.terrakok', 'kmp-hierarchy'
      }
    }
  }

  versionCatalogs {
    libs {
      from files('../gradle/libs.versions.toml')
    }
  }
}
