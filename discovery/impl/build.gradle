plugins {
  id 'software.ralf.storymile.library.kmp'
}

storymile {
  enableComposePresenterBackstack true
  enableMetro true
  enableSerialization true
}

dependencies {
  commonMainImplementation project(':coil:public')
  commonMainImplementation project(':episode-details:public')
  commonMainImplementation project(':http:public')
  commonMainImplementation project(':podcast:public')
  commonMainImplementation project(':runtime-mode:public')
  commonMainImplementation project(':templates:public')
  commonMainImplementation project(':theme:public')
  commonMainImplementation project(':user:public')
  commonMainImplementation project(':util:public')
  commonMainImplementation libs.serialization.json

  commonTestImplementation project(':episode-details:testing')
  commonTestImplementation project(':runtime-mode:testing')
  commonTestImplementation project(':theme:testing')
  commonTestImplementation project(':util:testing')
}
