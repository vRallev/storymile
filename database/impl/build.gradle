plugins {
  id 'software.ralf.storymile.library.kmp'
}

storymile {
  enableMetro true
  enableRoom true
  enableBrowserDatabaseDriver true
}

dependencies {
  commonMainImplementation project(':storage:public')
  commonMainImplementation project(':user:public')
  commonMainImplementation libs.androidx.room.runtime

  commonTestImplementation project(':storage:testing')

  noWasmJsMainImplementation libs.androidx.sqlite.bundled

  noWasmJsTestImplementation libs.okio
}
